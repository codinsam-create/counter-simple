<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Counter</title>
  <meta name="description" content="Ein minimaler Zähler – installierbar und offline nutzbar.">

  <meta name="theme-color" content="#171a23">
  <meta name="color-scheme" content="dark">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Counter">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <div class="status" id="status" role="status" aria-live="polite">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="status-text">Offline</span>
    </div>

    <h1 class="title">Counter</h1>

    <output class="value" id="value" aria-live="polite">0</output>

    <div class="controls">
      <button class="btn btn-decrement" id="decrement" type="button" aria-label="Verringern">
        &minus;
      </button>
      <button class="btn btn-reset" id="reset" type="button" aria-label="Zurücksetzen">
        Reset
      </button>
      <button class="btn btn-increment" id="increment" type="button" aria-label="Erhöhen">
        +
      </button>
    </div>

    <button class="install" id="install" type="button" hidden>App installieren</button>

    <p class="hint" id="hint">
      Tipp: Pfeiltasten ↑ / ↓ oder +/- zum Zählen, <kbd>R</kbd> zum Zurücksetzen.
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
