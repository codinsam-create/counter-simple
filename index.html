<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Counter</title>
  <meta name="description" content="Ein minimaler Zähler – installierbar und offline nutzbar.">

  <meta name="theme-color" content="#171a23">
  <meta name="color-scheme" content="dark">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Counter">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <div class="status" id="status" role="status" aria-live="polite">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="status-text">Offline</span>
    </div>

    <h1 class="title">Counter</h1>

    <output class="value" id="value" aria-live="polite">0</output>

    <div class="controls">
      <button class="btn btn-decrement" id="decrement" type="button" aria-label="Verringern">
        &minus;
      </button>
      <button class="btn btn-reset" id="reset" type="button" aria-label="Zurücksetzen">
        Reset
      </button>
      <button class="btn btn-increment" id="increment" type="button" aria-label="Erhöhen">
        +
      </button>
    </div>

    <div class="account">
      <span class="account-label" id="account-label">Nur auf diesem Gerät</span>
      <button class="account-btn" id="account-btn" type="button">Anmelden</button>
    </div>

    <p class="sync" id="sync" role="status" aria-live="polite" hidden></p>

    <button class="install" id="install" type="button" hidden>App installieren</button>

    <p class="hint" id="hint">
      Tipp: Pfeiltasten ↑ / ↓ oder +/- zum Zählen, <kbd>R</kbd> zum Zurücksetzen.
    </p>
  </main>

  <dialog class="auth-dialog" id="auth-dialog" aria-labelledby="auth-title">
    <form class="auth-form" id="auth-form" novalidate>
      <h2 class="auth-title" id="auth-title">Anmelden</h2>
      <p class="auth-intro" id="auth-intro">
        Melde dich an, um deinen Zähler auf mehreren Geräten zu synchronisieren.
      </p>

      <label class="auth-field">
        <span>E-Mail</span>
        <input id="auth-email" name="email" type="email" autocomplete="email" required>
      </label>

      <label class="auth-field">
        <span>Passwort</span>
        <input
          id="auth-password"
          name="password"
          type="password"
          autocomplete="current-password"
          minlength="6"
          required
        >
      </label>

      <p class="auth-error" id="auth-error" role="alert" hidden></p>

      <div class="auth-actions">
        <button class="btn btn-reset" id="auth-cancel" type="button">Abbrechen</button>
        <button class="btn btn-increment" id="auth-submit" type="submit">Anmelden</button>
      </div>

      <button class="auth-switch" id="auth-switch" type="button">
        Noch kein Konto? Registrieren
      </button>
    </form>
  </dialog>

  <script src="./config.js"></script>
  <script src="./vendor/supabase-js.js"></script>
  <script src="./backend-supabase.js"></script>
  <script src="./script.js"></script>
</body>
</html>
